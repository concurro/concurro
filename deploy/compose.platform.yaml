# PostgreSQL and JetStream for the ingress producer, private to Concurro services.
name: concurro-platform

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
      - /etc/concurro/platform/postgres-password:/run/secrets/postgres-password:ro
    networks:
      platform:
        aliases:
          - concurro-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
    restart: unless-stopped

  nats:
    image: nats:2.15.3
    command: ["--config", "/etc/nats/nats.conf"]
    volumes:
      - nats-data:/data
      - /etc/concurro/platform/nats.conf:/etc/nats/nats.conf:ro
    networks:
      platform:
        aliases:
          - concurro-nats
    restart: unless-stopped

networks:
  platform:
    name: platform

volumes:
  postgres-data:
  nats-data:
