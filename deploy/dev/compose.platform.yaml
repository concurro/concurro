name: concurro-platform-dev

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_PASSWORD: postgres-dev
    ports:
      - "127.0.0.1:${CONCURRO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-setup.sql:/docker-entrypoint-initdb.d/10-concurro.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  nats:
    image: nats:2.15.3
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:${CONCURRO_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${CONCURRO_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data

volumes:
  postgres_data:
  nats_data:
