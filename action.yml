name: Concurro controller
description: Advance one durable Concurro stage for the calling repository's issues.
author: concurro
branding:
  icon: users
  color: blue

# The caller checks out its trusted default branch first and supplies the App token,
# images and provider credentials as step environment; see examples/stacks-core.
runs:
  using: composite
  steps:
    - name: Advance one durable stage
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/engine/controller.py"
