name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per commit outside pull requests: every main commit publishes its images.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest@0.9.145
      - name: Install Python reference consumer
        run: python3 -m pip install -r contracts/python/requirements.txt
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Test Rust workspace
        run: cargo nextest run --workspace --locked
      - name: Test event fault injection
        run: cargo nextest run -p concurro-events-nats --features fault-injection --locked

  contracts:
    name: Wire contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python generator and runtime
        run: python3 -m pip install -r contracts/python/requirements.txt -r contracts/python/requirements-dev.txt
      - name: Check generated files
        env:
          DATAMODEL_CODEGEN: datamodel-codegen
        run: |
          cargo run -p concurro-contracts --bin generate --locked
          bash contracts/python/generate.sh
          test -z "$(git status --porcelain -- contracts/registry.json contracts/schemas contracts/python/concurro_contracts)"
      - name: Test Python contract fixtures and compatibility checker
        env:
          PYTHONPATH: contracts/python
        run: python3 -m unittest discover -s contracts/python/tests -v
      - name: Check schema compatibility
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 contracts/check_compat.py "$BASE_SHA"

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r service/requirements.txt -r contracts/python/requirements.txt -r gateway/vault/requirements.txt markdown-it-py==3.0.0 ruff==0.17.4 pyright==1.1.408
      - name: Lint Python
        run: ruff check engine service gateway deploy
      - name: Check Python formatting
        run: ruff format --check engine service gateway deploy
      - name: Check extracted engine types
        run: pyright --project pyrightconfig.json
      - run: python3 -m compileall -q engine service gateway/exchange gateway/vault
      - run: shellcheck deploy/*.sh
      - name: Verify trusted role, skill, schema and example charter packaging
        run: python3 engine/bundle.py examples/stacks-core

  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [engine, service, gateway, deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r service/requirements.txt -r contracts/python/requirements.txt -r gateway/vault/requirements.txt markdown-it-py==3.0.0
      # One process per test file, one file per core; each file's output is printed whole.
      - name: Run tests
        env:
          SUITE: ${{ matrix.suite }}
          PYTHONPATH: contracts/python
        run: |
          # shellcheck disable=SC2016
          find "$SUITE/tests" -name 'test*.py' -print0 | xargs -0 -P "$(nproc)" -n 1 sh -c '
            out=$(python3 -m unittest discover -s "$(dirname "$1")" -p "$(basename "$1")" -v 2>&1); rc=$?
            printf "%s\n" "$out"; exit $rc' sh

  # Release images, tagged with the commit. Hosts pull them; see gateway/README.md.
  images:
    name: Image (${{ matrix.image }})
    needs: [checks, tests, rust, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: service
            context: .
            dockerfile: service/Dockerfile
          - image: ingress
            context: .
            dockerfile: crates/ingress/Dockerfile
          - image: tasks
            context: .
            dockerfile: crates/tasks/Dockerfile
          - image: backoffice-read
            context: .
            dockerfile: crates/backoffice-api/Dockerfile
          - image: accounts
            context: .
            dockerfile: crates/accounts/Dockerfile
          - image: exchange
            context: .
            dockerfile: gateway/exchange/Dockerfile
          - image: vault
            context: .
            dockerfile: gateway/vault/Dockerfile
    env:
      RELEASE: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE: ghcr.io/concurro/${{ matrix.image }}:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The service image holds the checkout with its history.
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build --tag "$IMAGE" --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE" "$BUILD_CONTEXT"
      - name: Verify the service image serves this commit
        if: matrix.image == 'service'
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test "$(git rev-parse HEAD)" = "$1" && test -z "$(git status --porcelain)"' sh "$RELEASE"
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          docker push "$IMAGE"
