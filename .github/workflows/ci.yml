name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r service/requirements.txt markdown-it-py==3.0.0 ruff==0.17.4
      - name: Lint Python
        run: ruff check engine service gateway
      - name: Check Python formatting
        run: ruff format --check engine service gateway
      - run: python3 -m unittest discover -s engine/tests -v
      - run: python3 -m unittest discover -s service/tests -v
      - run: python3 -m unittest discover -s gateway/tests -v
      - run: python3 -m compileall -q engine service gateway/exchange
      - name: Verify trusted role, skill, schema and example charter packaging
        run: python3 engine/bundle.py examples/stacks-core
