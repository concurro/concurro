name: Concurro role session

on:
  workflow_call:
    inputs:
      session:
        description: Centrally issued task/role session
        type: string
        required: true
      gateway:
        description: Public Concurro gateway base URL
        type: string
        default: https://144.76.56.188/concurro
      runs-on:
        description: GitHub-hosted Linux runner label
        type: string
        default: ubuntu-24.04

permissions: {}

jobs:
  role:
    runs-on: ${{ inputs.runs-on }}
    cache-mode: read
    timeout-minutes: 360
    permissions:
      id-token: write
    env:
      GATEWAY: ${{ inputs.gateway }}
      SESSION: ${{ inputs.session }}
      CODEX_VERSION: 0.163.0
      CLAUDE_VERSION: 2.1.301
    steps:
      - name: Fetch the workflow's engine commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SESSION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=concurro-workflow" | jq -r .value)
          echo "::add-mask::$token"
          read -r repository sha < <(python3 -c 'import base64, json, sys
          p = sys.argv[1].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          print("/".join(c["job_workflow_ref"].split("/")[:2]), c["job_workflow_sha"])' "$token")
          [[ "$repository" == concurro/concurro && "$sha" =~ ^[0-9a-f]{40}$ ]]
          git init -q "$RUNNER_TEMP/concurro"
          git -C "$RUNNER_TEMP/concurro" fetch -q --depth 1 "https://github.com/$repository.git" "$sha"
          git -C "$RUNNER_TEMP/concurro" checkout -q --detach FETCH_HEAD

      - name: Claim role and start setup heartbeat
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/concurro/engine/runner.py" claim --session "$SESSION" \
            --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session"

      - name: Materialize pinned target setup and upstream base
        id: target
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/concurro/engine/runner.py" prepare --session "$SESSION" \
            --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session" \
            --config "$GITHUB_WORKSPACE/.concurro-config" --base "$RUNNER_TEMP/concurro-base"

      - name: Target-owned setup
        if: steps.target.outputs.setup == 'true'
        uses: ./.concurro-config/.concurro/setup
        with:
          base: ${{ steps.target.outputs.base }}

      - name: Install provider clients
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/concurro-clients" \
            "@openai/codex@$CODEX_VERSION" "@anthropic-ai/claude-code@$CLAUDE_VERSION"
          echo "$RUNNER_TEMP/concurro-clients/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Serve native turns
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/concurro/engine/runner.py" serve --session "$SESSION" \
            --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session"

      - name: End session
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/concurro/engine/runner.py" ]]; then
            python3 "$RUNNER_TEMP/concurro/engine/runner.py" end --session "$SESSION" \
              --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session"
          fi
