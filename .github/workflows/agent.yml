# The launcher: it authenticates to the deployment's exchange, which names the engine commit to
# run, and runs that commit. Its own commit is independent of the engine's, so it must keep
# working with every supported engine release: see "Launcher contract" in gateway/README.md.
name: Concurro role session

on:
  workflow_call:
    inputs:
      session:
        description: Centrally issued task/role session
        type: string
        required: true
      runs-on:
        description: GitHub-hosted Linux runner label
        type: string
        default: ubuntu-24.04
      task-label:
        description: Task or PR reference for display only
        type: string
        default: ''
      operation-label:
        description: Agent operation for display only
        type: string
        default: ''
      agent-label:
        description: Model profile, model and effort for display only
        type: string
        default: ''

    secrets:
      CONCURRO_GATEWAY_URL:
        description: Deployment gateway base URL
        required: true

permissions: {}

jobs:
  role:
    name: ${{ inputs.agent-label || 'Agent' }}
    runs-on: ${{ inputs.runs-on }}
    cache-mode: read
    timeout-minutes: 360
    permissions:
      id-token: write
    env:
      GATEWAY: ${{ secrets.CONCURRO_GATEWAY_URL }}
      SESSION: ${{ inputs.session }}
    steps:
      - name: Load Concurro runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GATEWAY" ]]; then
            echo '::error::CONCURRO_GATEWAY_URL must be configured and passed by the caller.'
            exit 1
          fi
          [[ "$SESSION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=concurro-gateway" | jq -r .value)
          echo "::add-mask::$token"
          # The exchange checks this job against the session and names the engine its service runs.
          read -r repository sha < <(curl -fsS -X POST -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{}' "${GATEWAY%/}/exchange/sessions/$SESSION/engine" \
            | jq -r '"\(.repository) \(.engine)"')
          [[ "$repository" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]]
          git init -q "$RUNNER_TEMP/concurro"
          git -C "$RUNNER_TEMP/concurro" fetch -q --depth 1 "https://github.com/$repository.git" "$sha"
          git -C "$RUNNER_TEMP/concurro" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$RUNNER_TEMP/concurro" rev-parse HEAD)" == "$sha" ]]

      - name: Claim agent session
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/concurro/engine/runner.py" claim --session "$SESSION" \
            --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session"

      - name: Prepare source and target configuration
        id: target
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/concurro/engine/runner.py" prepare --session "$SESSION" \
            --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session" \
            --config "$GITHUB_WORKSPACE/.concurro-config" --base "$RUNNER_TEMP/concurro-base"

      - name: Set up target toolchain
        if: steps.target.outputs.setup == 'true'
        uses: ./.concurro-config/.concurro/setup
        with:
          base: ${{ steps.target.outputs.base }}

      - name: Install agent clients
        shell: bash
        run: |
          xargs npm install --prefix "$RUNNER_TEMP/concurro-clients" \
            < "$RUNNER_TEMP/concurro/engine/agent-clients.txt"
          echo "$RUNNER_TEMP/concurro-clients/node_modules/.bin" >> "$GITHUB_PATH"

      - name: ${{ format('{0} · {1}', inputs.operation-label || 'Run agent', inputs.task-label || inputs.session) }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/concurro/engine/runner.py" serve --session "$SESSION" \
            --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session"

      - name: Close agent session
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/concurro/engine/runner.py" ]]; then
            python3 "$RUNNER_TEMP/concurro/engine/runner.py" end --session "$SESSION" \
              --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session"
          fi

      - name: Summarize agent results
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_TASK: ${{ inputs.task-label }}
          RUN_OPERATION: ${{ inputs.operation-label }}
          RUN_AGENT: ${{ inputs.agent-label }}
        run: |
          if [[ -f "$RUNNER_TEMP/concurro/engine/runner.py" ]]; then
            python3 "$RUNNER_TEMP/concurro/engine/runner.py" summary --session "$SESSION" \
              --gateway "$GATEWAY" --root "$RUNNER_TEMP/concurro-session"
          else
            printf '## Concurro result\n\nRuntime setup did not complete; no agent result was recorded.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
