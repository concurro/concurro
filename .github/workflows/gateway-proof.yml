name: Gateway proof

# Proves that a GitHub-hosted runner can run Claude Code and Codex through Concurro's
# inference gateway while holding nothing but a session key, minted from this job's
# OIDC token by the gateway's exchange and deleted when the job ends. Called from a
# target repository; see docs/design/inference-gateway.md.

on:
  workflow_call:
    inputs:
      session:
        description: Session ID issued by the gateway's exchange
        type: string
        required: true
      gateway:
        description: Gateway base URL, such as https://144.76.56.188/concurro
        type: string
        required: true

permissions: {}

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
    env:
      GATEWAY: ${{ inputs.gateway }}
      SESSION: ${{ inputs.session }}
      CLI_BASE: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
      CODEX_VERSION: 0.163.0
      CLAUDE_VERSION: 2.1.301
    steps:
      - name: Exchange the job's OIDC token for the session key
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=concurro-gateway" | jq -r .value)
          echo "::add-mask::$oidc"
          response=$(curl -fsS -X POST -H "Authorization: Bearer $oidc" "$GATEWAY/exchange/sessions/$SESSION/key")
          key=$(jq -r .key <<<"$response")
          echo "::add-mask::$key"
          install -d -m 700 "$RUNNER_TEMP/concurro"
          printf '%s' "$key" > "$RUNNER_TEMP/concurro/key"
          jq '{models, deadline}' <<<"$response"

      - name: Build the CLI image and the task
        run: |
          set -euo pipefail
          docker build -q -t concurro-proof-cli --build-arg BASE="$CLI_BASE" - <<EOF
          ARG BASE
          FROM \$BASE
          RUN npm install -g @openai/codex@$CODEX_VERSION @anthropic-ai/claude-code@$CLAUDE_VERSION && npm cache clean --force
          EOF
          for client in claude codex; do
            task="$RUNNER_TEMP/task-$client"
            mkdir -p "$task"
            printf 'def add(a, b):\n    return a - b\n' > "$task/calc.py"
            printf 'import unittest\nfrom calc import add\n\n\nclass T(unittest.TestCase):\n    def test_add(self):\n        self.assertEqual(add(2, 3), 5)\n\n\nif __name__ == "__main__":\n    unittest.main()\n' > "$task/test_calc.py"
            chmod -R a+rwX "$task"
          done

      - name: Claude Code fixes a bug through the gateway (Claude subscription)
        run: |
          set -euo pipefail
          docker run --rm --user 1000:1000 -e HOME=/tmp/home \
            -e ANTHROPIC_BASE_URL="$GATEWAY" -e ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/concurro/key")" \
            -e CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            -v "$RUNNER_TEMP/task-claude:/work" -w /work concurro-proof-cli \
            claude -p "Run the tests with python3 -m unittest, fix the bug in calc.py, run the tests again, and finish with one line: DONE plus the test result." \
            --model claude-opus-5-5 --output-format json --permission-mode acceptEdits \
            --allowedTools "Read" "Edit" "Bash(python3 -m unittest*)" > "$RUNNER_TEMP/claude.json"
          jq '{is_error, num_turns, result, usage: (.usage | {input_tokens, cache_read_input_tokens, cache_creation_input_tokens, output_tokens})}' "$RUNNER_TEMP/claude.json"
          test "$(jq -r .is_error "$RUNNER_TEMP/claude.json")" = false

      - name: Verify Claude Code's fix in a fresh offline container
        run: |
          docker run --rm --network none --user 1000:1000 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$RUNNER_TEMP/task-claude:/work:ro" -w /work concurro-proof-cli python3 -m unittest -v

      - name: Codex fixes a bug through the gateway (ChatGPT subscription)
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/codex"
          mkdir -p "$home"
          cat > "$home/config.toml" <<EOF
          model = "gpt-6.1-sol"
          model_provider = "concurro"
          check_for_update_on_startup = false

          [analytics]
          enabled = false

          [model_providers.concurro]
          name = "Concurro gateway (ChatGPT plan)"
          base_url = "$GATEWAY/v1"
          wire_api = "responses"
          supports_websockets = false
          http_headers = { "x-concurro-plan" = "chatgpt" }
          env_key = "CONCURRO_GATEWAY_KEY"
          EOF
          chmod -R a+rwX "$home"
          # The container is the boundary, holding only the session key; Codex's own sandbox
          # (bwrap) cannot create namespaces inside it.
          codex() {
            docker run --rm --user 1000:1000 -e HOME=/codex -e CODEX_HOME=/codex \
              -e CONCURRO_GATEWAY_KEY="$(cat "$RUNNER_TEMP/concurro/key")" \
              -v "$home:/codex" -v "$RUNNER_TEMP/task-codex:/work" -w /work concurro-proof-cli \
              codex exec --json --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox "$@"
          }
          codex "Run the tests with python3 -m unittest, fix the bug in calc.py, run the tests again, and finish with one line: DONE plus the test result." > "$RUNNER_TEMP/codex-1.jsonl"
          codex resume --last "In one line: what did you change, and what did the tests report before and after?" > "$RUNNER_TEMP/codex-2.jsonl"
          for turn in 1 2; do
            jq -c 'select(.type == "item.completed" and (.item.type == "agent_message" or .item.type == "command_execution")) | [.item.type, (.item.text // .item.command)]' "$RUNNER_TEMP/codex-$turn.jsonl"
            jq -c 'select(.type == "turn.completed") | .usage' "$RUNNER_TEMP/codex-$turn.jsonl"
            jq -e 'select(.type == "turn.completed")' "$RUNNER_TEMP/codex-$turn.jsonl" > /dev/null
          done

      - name: Verify Codex's fix in a fresh offline container
        run: |
          docker run --rm --network none --user 1000:1000 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$RUNNER_TEMP/task-codex:/work:ro" -w /work concurro-proof-cli python3 -m unittest -v

      - name: Agent containers see no job credential
        run: |
          set -euo pipefail
          leaked=$(docker run --rm -e ANTHROPIC_AUTH_TOKEN=session-key-only concurro-proof-cli env \
            | grep -cE '^(ACTIONS_|GITHUB_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|CLAUDE_CODE_OAUTH_TOKEN)' || true)
          test "$leaked" = 0

      - name: End the session; the key stops working
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/concurro/key" || exit 0
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=concurro-gateway" | jq -r .value)
          echo "::add-mask::$oidc"
          curl -fsS -X POST -H "Authorization: Bearer $oidc" "$GATEWAY/exchange/sessions/$SESSION/end"
          # Deletion reaches the traffic path asynchronously; allow it a few seconds.
          for _ in $(seq 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat "$RUNNER_TEMP/concurro/key")" "$GATEWAY/v1/models")
            [ "$status" = 401 ] && break
            sleep 1
          done
          echo "key after the session ended: HTTP $status"
          test "$status" = 401
