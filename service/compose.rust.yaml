# Rust controller, read and account processes. Keep the Python service stopped.
services:
  tasks:
    image: ghcr.io/concurro/tasks:${CONCURRO_RELEASE:?}
    build:
      context: ..
      dockerfile: crates/tasks/Dockerfile
    environment:
      CONCURRO_TASKS_CONFIG: /etc/concurro/tasks/settings.toml
    volumes:
      - /etc/concurro/tasks:/etc/concurro/tasks:ro
      # Reviewer OAuth refresh atomically replaces its grant in this directory.
      - /var/lib/concurro/tasks/reviewer:/var/lib/concurro/tasks/reviewer
    networks:
      edge: {}
      platform:
        aliases:
          - concurro-tasks
    restart: unless-stopped

  backoffice-read:
    image: ghcr.io/concurro/backoffice-read:${CONCURRO_RELEASE:?}
    build:
      context: ..
      dockerfile: crates/backoffice-api/Dockerfile
    environment:
      CONCURRO_BACKOFFICE_CONFIG: /etc/concurro/backoffice-read/settings.toml
    volumes:
      - /etc/concurro/backoffice-read:/etc/concurro/backoffice-read:ro
    networks:
      edge:
        aliases:
          - concurro-backoffice-read
      platform: {}
    restart: unless-stopped

  accounts:
    image: ghcr.io/concurro/accounts:${CONCURRO_RELEASE:?}
    build:
      context: ..
      dockerfile: crates/accounts/Dockerfile
    environment:
      CONCURRO_ACCOUNTS_CONFIG: /etc/concurro/accounts/settings.toml
    volumes:
      - /etc/concurro/accounts:/etc/concurro/accounts:ro
    networks:
      edge:
        aliases:
          - concurro-accounts
      platform:
        aliases:
          - concurro-accounts-platform
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8793/api/health"]
      interval: 30s
      timeout: 10s
    restart: unless-stopped

networks:
  platform:
    external: true
    name: platform
