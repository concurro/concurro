# The Concurro service on the gateway's host: webhooks arrive through the shared edge Caddy
# (`/concurro/webhook` in gateway/concurro.caddy), all model turns run natively on the
# targets' GitHub-hosted runners. Settings and secrets, and the state directory, are mounted at the
# same paths as on the host, so the paths in settings.json hold in both. CI publishes the images;
# the release variables come from the host's release file. See gateway/README.md.
name: concurro-service

services:
  service:
    image: ghcr.io/concurro/service:${CONCURRO_RELEASE:?}
    build:
      context: ..
      dockerfile: service/Dockerfile
    volumes:
      - /etc/concurro/service:/etc/concurro/service:ro
      - /var/lib/concurro/service:/var/lib/concurro/service
      - /var/lib/concurro/diagnostics:/var/lib/concurro/diagnostics
    networks:
      edge:
        aliases:
          - concurro-service
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 15m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 60s
      timeout: 10s
    restart: unless-stopped

  # The backoffice API, at /concurro/api and /concurro/auth on the edge (gateway/concurro.caddy). It reads
  # the diagnostics directory the service writes; settings and the OAuth client secret are its own.
  backoffice:
    image: ghcr.io/concurro/backoffice-api:${CONCURRO_RELEASE:?}
    build:
      context: ..
      dockerfile: backoffice/Dockerfile
    volumes:
      - /etc/concurro/backoffice:/etc/concurro/backoffice:ro
      - backoffice-data:/var/lib/concurro/backoffice
      - /var/lib/concurro/diagnostics:/var/lib/concurro/diagnostics
    networks:
      edge:
        aliases:
          - concurro-backoffice
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
    restart: unless-stopped

  # The backoffice web app (github.com/concurro/concurro-backoffice), released on its own.
  web:
    image: ghcr.io/concurro/backoffice-web:${CONCURRO_WEB_RELEASE:?}
    networks:
      edge:
        aliases:
          - concurro-backoffice-web
    read_only: true
    tmpfs:
      - /config:size=8m,uid=65532,gid=65532
      - /data:size=8m,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 10s
    restart: unless-stopped

networks:
  edge:
    external: true
    name: edge

volumes:
  backoffice-data:
