[package]
name = "s0-oidc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[workspace.dependencies]
jsonwebtoken = { version = "=12.0.0", default-features = false }
serde = { version = "=1.0.229" }
serde_json = { version = "=1.0.154" }
base64 = { version = "=0.23.1" }
rsa = { version = "=0.10.0" }
rand = { version = "=0.10.4" }
[dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"], default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rsa = { workspace = true, features = ["encoding"] }
rand = { workspace = true }
