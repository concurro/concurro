[package]
name = "s0-oidc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
