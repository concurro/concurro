[package]
name = "s0-passthrough"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["stream"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio-stream = "0.1"
tokio-tungstenite = "0.28"
