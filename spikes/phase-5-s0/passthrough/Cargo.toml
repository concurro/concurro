[package]
name = "s0-passthrough"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false }
bytes = { version = "=1.12.2" }
futures-util = { version = "=0.3.34", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
serde_json = { version = "=1.0.154" }
tokio = { version = "=1.54.1" }
tokio-stream = { version = "=0.1.19" }
tokio-tungstenite = { version = "=0.30.0" }
[dependencies]
axum = { workspace = true, features = ["http1", "tokio"], default-features = false }
bytes = { workspace = true }
futures-util = { workspace = true, features = ["std"], default-features = false }
reqwest = { workspace = true, features = ["stream"], default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
