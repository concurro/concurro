[package]
name = "concurro-agy"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "backup"], optional = true }

[features]
default = ["runner"]
runner = ["dep:rusqlite"]

[[bin]]
name = "agy-runner"
path = "src/main.rs"
required-features = ["runner"]

[dev-dependencies]
axum.workspace = true
