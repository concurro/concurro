publish.workspace = true

[[bin]]
name = "accounts"
path = "src/main.rs"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
async-nats.workspace = true
axum = { workspace = true, features = ["query"] }
axum-extra.workspace = true
base64.workspace = true
chrono.workspace = true
concurro-accounts-postgres = { path = "../accounts-postgres" }
concurro-config = { path = "../config" }
concurro-contracts = { path = "../contracts" }
concurro-db = { path = "../db" }
concurro-events = { path = "../events" }
concurro-events-nats = { path = "../events-nats" }
concurro-events-postgres = { path = "../events-postgres" }
concurro-github-v1 = { path = "../github-v1" }
concurro-relay-hosted-api = { git = "https://github.com/concurro/concurro-relay", rev = "dcb96c69ef4f1a7c5c355a40802ec7253084d849" }
concurro-secrets = { path = "../secrets" }
concurro-telemetry = { path = "../telemetry" }
graphile_worker.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
oauth2.workspace = true
rand.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
