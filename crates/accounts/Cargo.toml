sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["sqlite"] }
concurro-backoffice-api = { path = "../backoffice-api" }
concurro-backoffice-postgres = { path = "../backoffice-postgres" }
concurro-tasks-postgres = { path = "../tasks-postgres" }
concurro-testkit = { path = "../testkit" }
concurro-tasks = { path = "../tasks" }
tower = "=0.5.3"
