# The host's shared HTTPS entry point. Services join the `edge` network and add a route
# file to ${EDGE_ETC}/sites; none publishes ports of its own. Domain names get a site file
# in ${EDGE_ETC}/domains. Installed as /etc/edge/compose.yaml beside the Caddyfile; see
# gateway/README.md.
name: edge

services:
  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    ports:
      - "${EDGE_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${EDGE_ETC:-/etc/edge}/sites:/etc/caddy/sites:ro
      - ${EDGE_ETC:-/etc/edge}/domains:/etc/caddy/domains:ro
      - ${EDGE_ETC:-/etc/edge}/tls:/tls:ro
      - caddy-data:/data
    networks:
      - edge
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped

networks:
  edge:
    name: edge

volumes:
  caddy-data:
