# The host's shared HTTPS entry point. Services join the `edge` network and add a route
# file to ${EDGE_ETC}/sites; none publishes ports of its own. Installed as
# /etc/edge/compose.yaml beside the Caddyfile; see gateway/README.md.
name: edge

services:
  caddy:
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    ports:
      - "${EDGE_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${EDGE_ETC:-/etc/edge}/sites:/etc/caddy/sites:ro
      - ${EDGE_ETC:-/etc/edge}/tls:/tls:ro
      - caddy-data:/data
    networks:
      - edge
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped

networks:
  edge:
    name: edge

volumes:
  caddy-data:
