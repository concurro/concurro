# Concurro's inference gateway: agentgateway and the key exchange (sharing the gateway's
# network namespace, so it alone reaches the loopback admin API). Nothing is published:
# the host's edge Caddy reaches both on the `edge` network as `concurro-gateway`, through
# the routes in concurro.caddy. The credentials vault has no Caddy route; only services on
# the `edge` network reach it, as `concurro-vault:8090`.
name: concurro-gateway

services:
  # Gives the distroless gateway (uid 65532) its data volume.
  init:
    image: ghcr.io/concurro/exchange:${CONCURRO_RELEASE:?}
    build: ./exchange
    user: "0:0"
    entrypoint: ["chown", "65532:65532", "/gateway-data"]
    network_mode: none
    mem_limit: 64m
    volumes:
      - gateway-data:/gateway-data

  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    command: ["-f", "/config/agentgateway.yaml"]
    env_file:
      - ${CONCURRO_GATEWAY_ETC:-/etc/concurro/gateway}/secrets.env
    volumes:
      - ./agentgateway.yaml:/config/agentgateway.yaml:ro
      - gateway-data:/data
    networks:
      edge:
        aliases:
          - concurro-gateway
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped

  exchange:
    image: ghcr.io/concurro/exchange:${CONCURRO_RELEASE:?}
    build: ./exchange
    network_mode: "service:gateway"
    environment:
      EXCHANGE_AUDIENCE: concurro-gateway
      EXCHANGE_LISTEN: 0.0.0.0:8080
    # EXCHANGE_OPERATOR_TOKEN: the Concurro service's credential for minting keys and queueing turns.
    env_file:
      - ${CONCURRO_GATEWAY_ETC:-/etc/concurro/gateway}/exchange.env
    volumes:
      - exchange-data:/data
    depends_on:
      - gateway
    mem_limit: 1g
    pids_limit: 64
    restart: unless-stopped

  vault:
    image: ghcr.io/concurro/vault:${CONCURRO_RELEASE:?}
    build: ./vault
    environment:
      VAULT_LISTEN: 0.0.0.0:8090
      VAULT_STATE_DIR: /data
      VAULT_MASTER_KEY_FILE: /run/secrets/vault-master-key
    volumes:
      # Owner-only (uid 65532, mode 0400); the vault refuses to start otherwise.
      - ${CONCURRO_GATEWAY_ETC:-/etc/concurro/gateway}/vault-master-key:/run/secrets/vault-master-key:ro
      - vault-data:/data
    networks:
      edge:
        aliases:
          - concurro-vault
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 60s
      timeout: 10s
    restart: unless-stopped

volumes:
  gateway-data:
  exchange-data:
  vault-data:

networks:
  edge:
    external: true
    name: edge
